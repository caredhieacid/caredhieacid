<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">caredhieacid — AI agents, developer tooling, and applied machine learning</title>
  <desc id="desc">A dark terminal-inspired banner with a small cat illustration.</desc>

  <defs>
